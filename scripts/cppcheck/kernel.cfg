<?xml version="1.0"?>
<def format="2">
  <!-- Keep allocator families separate to expose ownership mismatches. -->
  <memory>
    <alloc init="false" buffer-size="malloc:1">kmalloc</alloc>
    <alloc init="true" buffer-size="malloc:1">kzalloc</alloc>
    <alloc init="false" buffer-size="calloc">kmalloc_array</alloc>
    <alloc init="true" buffer-size="calloc">kcalloc</alloc>
    <dealloc>kfree</dealloc>
  </memory>
  <!-- kvfree accepts both slab and virtual allocations. The library's single
       group ID cannot encode that asymmetric compatibility without accepting
       kfree(kvmalloc(...)). Leave that ownership relation unmodeled. -->
  <function name="kmalloc,kzalloc">
    <noreturn>false</noreturn>
    <use-retval/>
    <arg nr="1" direction="in"><not-uninit/></arg>
    <arg nr="2" direction="in"><not-uninit/></arg>
  </function>
  <function name="kvmalloc,kvzalloc">
    <noreturn>false</noreturn>
    <use-retval/>
    <arg nr="1" direction="in"><not-uninit/></arg>
    <arg nr="2" direction="in"><not-uninit/></arg>
  </function>
  <function name="kmalloc_array,kcalloc,kvmalloc_array,kvcalloc">
    <noreturn>false</noreturn>
    <use-retval/>
    <arg nr="1" direction="in"><not-uninit/></arg>
    <arg nr="2" direction="in"><not-uninit/></arg>
    <arg nr="3" direction="in"><not-uninit/></arg>
  </function>
  <function name="kfree,kvfree">
    <noreturn>false</noreturn>
    <arg nr="1" direction="in"><not-uninit/></arg>
  </function>
</def>
