name: Run regression tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WERROR: 'n'

jobs:
  prepare_matrix:
    name: Prepare kernel matrix
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.changes.outputs.run }}
      regression: ${{ steps.matrix.outputs.regression }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check CI selection
        run: python3 -m unittest discover -s scripts/ci -p 'test_select_checks.py'

      - name: Select kernel regression checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci/select_checks.py --check regression --event "$GITHUB_EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Resolve kernel matrix
        if: steps.changes.outputs.run == 'true'
        id: matrix
        shell: bash
        run: |
          matrix="$(bash scripts/kernel/kernel-matrix regression)"
          printf 'regression=%s\n' "${matrix}" >>"${GITHUB_OUTPUT}"

  regression_tests:
    name: ${{ matrix.version }}
    needs: prepare_matrix
    # Job conditions are evaluated before expanding the matrix.
    if: needs.prepare_matrix.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare_matrix.outputs.regression) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      - name: Install libelf-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libelf-dev

      - name: Run regression tests
        run: |
          err=0
          version="${{matrix.version}}"
          workdir="/tmp/scst-${version}"
          out="output.txt"

          ./scripts/kernel/run-regression-tests -l -q -d "${workdir}" "${version}-nc-ns-nm" | tee "${out}"

          if ! grep -q "Compiling the patched kernel" "${out}"; then
            echo "::error title=Regression tests::run-regression-tests failed"
            err=1
          else
            if grep -A1 "Compiling the patched kernel" "${out}" | grep -E -q "FAILED|[1-9][0-9]* errors"; then
              echo "::error title=Regression tests::Regression test failed"
              err=1
            else
              echo "::notice title=Regression tests::Succeeded"
            fi

            f=( "${workdir}"/compilation-*-output.txt )
            echo
            echo "===== $(basename "${f[0]}") ====="
            cat "${f[0]}"
          fi

          rm -rf "${workdir}"
          rm -f "${out}"

          exit $err
