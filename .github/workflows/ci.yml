name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WERROR: 'y'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [clang]
        arch: [x86_64]
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check CI selection
        run: python3 -m unittest discover -s scripts/ci -p 'test_select_checks.py'
      - name: Select Clang build
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci/select_checks.py --check clang --event "$GITHUB_EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Install build-essential
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts dpkg-dev quilt
      - name: Install multilib
        run: |
          sudo apt-get install -y gcc-multilib g++-multilib
        if: steps.changes.outputs.run == 'true' && matrix.arch == 'x86'
      - name: Build
        if: steps.changes.outputs.run == 'true'
        env:
          'CC': ${{ matrix.compiler }}
          CFLAGS: ${{ matrix.arch == 'x86' && '-m32' || '' }}
          LDFLAGS: ${{ matrix.arch == 'x86' && '-m32' || '' }}
        run: make CC=${{matrix.compiler}} dpkg
