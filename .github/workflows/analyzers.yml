name: Static analyzers

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scs-lint:
    name: SCST code style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: false
      - name: Test SCST style rules
        run: make scs-lint-test
      - name: Run make scs_lint
        run: make scs_lint
      - name: Save complete analyzer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scs-lint-evidence
          retention-days: 7
          path: .cache/lint/

  native:
    name: ${{ matrix.analyzer == 'analyzer-tests' && 'Analyzer tests' || matrix.analyzer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        analyzer:
          - analyzer-tests
          - sparse
          - smatch
          - checkpatch
          - coccicheck
          - cppcheck
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare analyzer environment
        run: |
          docker build -f scripts/ci/analyzers.Dockerfile -t scst-analyzers:local . \
            2>&1 | tee "$RUNNER_TEMP/analyzer-image.log"
      - name: Run make ${{ matrix.analyzer }}
        env:
          ANALYZER: ${{ matrix.analyzer }}
        run: |
          source scripts/ci/kernel.env
          docker run --rm --init --network=none --cap-drop=ALL \
            --security-opt=no-new-privileges --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env GITHUB_ACTIONS=true \
            --env GITHUB_STEP_SUMMARY=/scst/.cache/analyzer-summary \
            --env "KDIR=/usr/src/kernels/$KERNEL_BUILD.x86_64" \
            --mount "type=bind,src=$PWD,dst=/scst" scst-analyzers:local \
            sh -c 'if [ "$1" = analyzer-tests ]; then
              exec make analyzer-tests
            else
              exec python3 -B scripts/ci/run-analyzer.py "$1"
            fi' -- "$ANALYZER"
      - name: Publish summary
        if: always()
        run: |
          if [[ -f .cache/analyzer-summary ]]; then
            cat .cache/analyzer-summary >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save complete analyzer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.analyzer }}-evidence
          retention-days: 7
          path: |
            ${{ runner.temp }}/analyzer-image.log
            .cache/lint/
            .cache/analyzer-summary
