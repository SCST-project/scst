name: Static analyzers

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scs-lint:
    name: SCST code style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: false
      - name: Test SCST style rules
        run: make scs-lint-test
      - name: Run make scs_lint
        run: make scs_lint
      - name: Save complete analyzer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scs-lint-evidence
          retention-days: 7
          path: .cache/lint/

  checkpatch:
    name: checkpatch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch Checkpatch and data from current Linux master
        run: |
          bash scripts/ci/fetch-checkpatch "$RUNNER_TEMP/checkpatch" \
            2>&1 | tee "$RUNNER_TEMP/checkpatch-fetch.log"
          echo "CHECKPATCH_PATH=$RUNNER_TEMP/checkpatch/scripts" >> "$GITHUB_ENV"
      - name: Test Checkpatch integration
        run: make analyzer-tests ANALYZER_TEST_GROUP=checkpatch
      - name: Run make checkpatch
        run: python3 -B scripts/ci/run-analyzer.py checkpatch
      - name: Save complete analyzer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkpatch-evidence
          retention-days: 7
          path: |
            ${{ runner.temp }}/checkpatch-fetch.log
            ${{ runner.temp }}/checkpatch/
            .cache/lint/

  native:
    name: ${{ matrix.analyzer == 'analyzer-tests' && 'Analyzer tests' || matrix.analyzer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        analyzer:
          - analyzer-tests
          - sparse
          - smatch
          - coccicheck
          - cppcheck
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare analyzer environment
        env:
          DOCKER_BUILDKIT: "1"
          ANALYZER: ${{ matrix.analyzer }}
        run: |
          build_args=()
          if [[ "$ANALYZER" == sparse || "$ANALYZER" == smatch ]]; then
            build_args+=(--build-arg "ANALYZER_REFRESH=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          fi
          docker build -f scripts/ci/analyzers.Dockerfile --target "$ANALYZER" \
            "${build_args[@]}" -t scst-analyzers:local . \
            2>&1 | tee "$RUNNER_TEMP/analyzer-image.log"
      - name: Run make ${{ matrix.analyzer }}
        env:
          ANALYZER: ${{ matrix.analyzer }}
        run: |
          docker run --rm --init --network=none --cap-drop=ALL \
            --security-opt=no-new-privileges --user "$(id -u):$(id -g)" \
            --env HOME=/tmp --env GITHUB_ACTIONS=true \
            --env GITHUB_STEP_SUMMARY=/scst/.cache/analyzer-summary \
            --mount "type=bind,src=$PWD,dst=/scst" scst-analyzers:local \
            sh -ec 'case "$1" in
              analyzer-tests) exec make analyzer-tests ANALYZER_TEST_GROUP=common ;;
              coccicheck|cppcheck) make analyzer-tests ANALYZER_TEST_GROUP="$1" ;;
            esac
            exec python3 -B scripts/ci/run-analyzer.py "$1"' -- "$ANALYZER"
      - name: Publish summary
        if: always()
        run: |
          if [[ -f .cache/analyzer-summary ]]; then
            cat .cache/analyzer-summary >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save complete analyzer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.analyzer }}-evidence
          retention-days: 7
          path: |
            ${{ runner.temp }}/analyzer-image.log
            .cache/lint/
            .cache/analyzer-summary
