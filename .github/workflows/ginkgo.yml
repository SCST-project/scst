name: Ginkgo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ginkgo:
    name: Build and run in VMs
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Compare the whole PR against its merge base, including fork PRs.
          fetch-depth: 0
      - name: Check CI selection
        run: python3 -m unittest discover -s scripts/ci -p 'test_select_checks.py'
      - name: Select Ginkgo checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci/select_checks.py --check ginkgo --event "$GITHUB_EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Install build and VM tools
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils openssh-client e2fsprogs fakeroot
      - name: Build SCST image and check Ginkgo framework
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 40
        run: bash scripts/ci/build-image ginkgo "$RUNNER_TEMP/ginkgo-image"
      - name: Run local and iSCSI tests against the compiled SCST
        if: steps.changes.outputs.run == 'true'
        env:
          GINKGO_LABEL: ${{ github.event_name == 'pull_request' && 'ci-pr' || github.event_name == 'push' && 'ci-push' || '' }}
        run: |
          python3 scripts/ci/vm.py ginkgo "$RUNNER_TEMP/ginkgo-image" \
            "$RUNNER_TEMP/ginkgo-results" --timeout 10000 --ginkgo-label "$GINKGO_LABEL"
      - name: Save build logs, reports and serial consoles
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ginkgo-results
          retention-days: 7
          path: |
            ${{ runner.temp }}/ginkgo-image/*.log
            ${{ runner.temp }}/ginkgo-image/*.json
            ${{ runner.temp }}/ginkgo-image/*.txt
            ${{ runner.temp }}/ginkgo-results/

  user-kernels:
    # Run the local scst_user specs on both sides of the Linux 5.9 boundary of
    # dev_user_map_buf(). Named like the regression jobs; the build step checks
    # each name against its scripts/ci/<pin>.env.
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - pin: kernel-5.8
            name: 5.8.18-300.fc33^Fedora^33
          - pin: kernel-5.9
            name: 5.9.16-200.fc33^Fedora^33
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select Ginkgo checks
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/ci/select_checks.py --check ginkgo --event "$GITHUB_EVENT_NAME" \
            --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Install build and VM tools
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils openssh-client e2fsprogs fakeroot
      - name: Build SCST image with the kernel from scripts/ci/${{ matrix.pin }}.env
        if: steps.changes.outputs.run == 'true'
        timeout-minutes: 60
        env:
          PIN: ${{ matrix.pin }}
          NAME: ${{ matrix.name }}
        run: |
          source "scripts/ci/$PIN.env"
          [[ $NAME == "$KERNEL_BUILD^"* ]] || { echo "::error::$NAME does not match $PIN.env"; exit 1; }
          bash scripts/ci/build-image ginkgo "$RUNNER_TEMP/ginkgo-image" "$PIN"
      - name: Run local scst_user tests against the compiled SCST
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 scripts/ci/vm.py ginkgo "$RUNNER_TEMP/ginkgo-image" \
            "$RUNNER_TEMP/ginkgo-results" --timeout 3000 --local-only --ginkgo-label user
      - name: Save build logs, reports and serial console
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ginkgo-${{ matrix.pin }}-results
          retention-days: 7
          path: |
            ${{ runner.temp }}/ginkgo-image/*.log
            ${{ runner.temp }}/ginkgo-image/*.json
            ${{ runner.temp }}/ginkgo-image/*.txt
            ${{ runner.temp }}/ginkgo-results/
