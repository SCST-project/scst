# SPDX-License-Identifier: GPL-2.0-only
# PR selection only; push and manual runs always run their checks.
# Paths are literal repository-relative names, not globs. Prefixes end in '/'.
# Skip rules take precedence, then exact paths, then non-overlapping prefixes.
# Unlisted paths, this config and the selector itself always run every check.
# Validate with: python3 scripts/ci/select_checks.py --validate-config

[skip]
basenames = ["AGENTS.md"]
paths = [
    # Do not exempt all documentation: some files are package/kernel inputs.
    "CONTRIBUTING.md",
    "INSTALL.md",
    "README.md",
    "README.clang",
    "README.cross-compilation",
    "README.module-signing",
    "README.performance",
    "doc/CI.md",
    "doc/KUNIT.md",
    "scripts/README.md",
    "scripts/kunit/upstream/README.md",
    "tests/ginkgo/README.md",
    # Independent source checks.
    "scripts/checkpatch",
    "scripts/checkpatch_commits",
    "scripts/checkpatch_diff",
    "scripts/checkpatch_scan",
    "scripts/source/list-double-blank-lines",
    "scripts/source/run-shellcheck",
    # Release-only inputs are exercised by Packages on master.
    ".github/workflows/rpm.yml",
    "scripts/release/build-rpm-artifacts",
    "scripts/release/generate-release-archive",
    "scripts/release/prepare-package-release",
    "scripts/release/update-version",
]

[[rules]]
# VM inputs shared by both suites.
paths = [
    "scripts/ci/Dockerfile",
    "scripts/ci/build-guest",
    "scripts/ci/build-image",
    "scripts/ci/guest",
    "scripts/ci/kernel.SHA256SUMS",
    "scripts/ci/kernel.env",
    "scripts/ci/scst-ci.service",
    "scripts/ci/scst-ci.target",
    "scripts/ci/test_vm.py",
    "scripts/ci/vm.py",
]
checks = ["ginkgo", "kunit"]

[[rules]]
paths = [
    ".github/workflows/ginkgo.yml",
    # Only the scst_user Ginkgo jobs boot these kernels.
    "scripts/ci/kernel-5.8.SHA256SUMS",
    "scripts/ci/kernel-5.8.env",
    "scripts/ci/kernel-5.9.SHA256SUMS",
    "scripts/ci/kernel-5.9.env",
]
checks = ["ginkgo"]

[[rules]]
paths = [".github/workflows/kunit.yml"]
checks = ["kunit"]

[[rules]]
paths = [".github/workflows/ci.yml"]
checks = ["clang"]

[[rules]]
paths = [".github/workflows/run_regression_tests.yaml"]
checks = ["regression"]

[[rules]]
# KUnit tooling tests execute kernel patch generation and regression helpers.
paths = [
    "scripts/kernel/generate-kernel-patch",
    "scripts/kernel/run-regression-tests",
    "scripts/kernel/kernel-functions",
    "scripts/kernel/filter-trace-entry-exit",
    "scripts/kernel/specialize-patch",
]
checks = ["kunit", "regression"]

[[rules]]
paths = ["doc/scst_pg.sgml", "doc/scst_user_spec.sgml", "doc/fig1.png", "doc/fig2.png"]
checks = ["kunit", "clang", "regression"]

[[rules]]
prefixes = ["tests/ginkgo/"]
checks = ["ginkgo"]

[[rules]]
# Both VM suites import kernel_diagnostics from the KUnit runner.
prefixes = ["scripts/kunit/"]
checks = ["ginkgo", "kunit"]

[[rules]]
prefixes = ["debian/"]
checks = ["clang"]
